name = "futurecar"
main = "worker.js"
compatibility_date = "2026-09-18"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[vars]
OPENAI_MODEL = "gpt-5.6-luna"
SEARCH_CONTEXT_SIZE = "medium"
USER_REGION = "Sardegna"
USER_CITY = "Cagliari"

# OPENAI_API_KEY NON va qui: è un secret.
#   npx wrangler secret put OPENAI_API_KEY
# In locale: crea .dev.vars con OPENAI_API_KEY="sk-..."
